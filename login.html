<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Totem Nube — Ingresar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --border:#30363d; --border2:#3a4055;
    --text:#e8eaf0; --text2:#c9cdd6; --text3:#7a8099; --green:#2ecc71; --red:#ff4d6a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:32px 28px;
  }
  .logo{ font-size:15px; font-weight:700; letter-spacing:0.02em; margin-bottom:2px; }
  .subtitle{ font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:24px; }
  label{ display:block; font-size:11px; color:var(--text3); margin-bottom:5px; margin-top:14px; }
  input{
    width:100%; height:38px; background:#0d1117; border:1px solid var(--border2); border-radius:8px;
    padding:0 12px; color:var(--text); font-size:13px;
  }
  input:focus{ outline:none; border-color:var(--green); }
  button{
    width:100%; height:40px; margin-top:22px; border:none; border-radius:8px; cursor:pointer;
    font-size:13px; font-weight:600; background:var(--green); color:#08130a;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .link-btn{
    background:transparent; color:var(--text3); font-weight:400; margin-top:10px; height:32px;
    text-decoration:underline; font-size:12px;
  }
  .msg{ font-size:12px; margin-top:14px; padding:8px 10px; border-radius:6px; display:none; }
  .msg.err{ display:block; background:rgba(255,77,106,0.12); color:var(--red); border:1px solid rgba(255,77,106,0.3); }
  .msg.ok{ display:block; background:rgba(46,204,113,0.12); color:var(--green); border:1px solid rgba(46,204,113,0.3); }
  #panel-signup{ display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Totem Nube</div>
    <div class="subtitle" id="panel-title">Ingresar</div>

    <div id="panel-login">
      <label>Email</label>
      <input type="email" id="login-email" autocomplete="username">
      <label>Contraseña</label>
      <input type="password" id="login-pass" autocomplete="current-password">
      <button onclick="hacerLogin()" id="btn-login">Ingresar</button>
      <button class="link-btn" onclick="mostrarSignup()">¿No tenés cuenta todavía? Crear una</button>
    </div>

    <div id="panel-signup">
      <label>Nombre</label>
      <input type="text" id="signup-nombre">
      <label>Email</label>
      <input type="email" id="signup-email" autocomplete="username">
      <label>Contraseña</label>
      <input type="password" id="signup-pass" autocomplete="new-password">
      <button onclick="hacerSignup()" id="btn-signup">Crear cuenta</button>
      <button class="link-btn" onclick="mostrarLogin()">Ya tengo cuenta — volver a ingresar</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

<script>
  const SUPABASE_URL = 'https://nkkwukcgxyhudprlhjjw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ra3d1a2NneHlodWRwcmxoamp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMjAzNTQsImV4cCI6MjA5MzU5NjM1NH0.NGDzPGnChtqYbnjcIZhso1CUozqG_JQ7TyElKSesy5s';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(location.search);
  const redirect = params.get('redirect') || 'index.html';
  const motivo = params.get('motivo');

  function mostrarMsg(texto, tipo){
    const el = document.getElementById('msg');
    el.textContent = texto;
    el.className = 'msg ' + tipo;
  }

  if(motivo === 'inactivo') mostrarMsg('Tu usuario está deshabilitado. Consultá con Gerencia.', 'err');
  if(motivo === 'sin_perfil') mostrarMsg('Tu cuenta no tiene un perfil asignado todavía. Consultá con Gerencia.', 'err');

  // Si ya hay sesión activa, no mostrar el login — ir directo al módulo pedido.
  sb.auth.getSession().then(({data})=>{
    if(data.session) location.href = redirect;
  });

  function mostrarSignup(){
    document.getElementById('panel-login').style.display = 'none';
    document.getElementById('panel-signup').style.display = 'block';
    document.getElementById('panel-title').textContent = 'Crear cuenta';
    document.getElementById('msg').className = 'msg';
  }
  function mostrarLogin(){
    document.getElementById('panel-signup').style.display = 'none';
    document.getElementById('panel-login').style.display = 'block';
    document.getElementById('panel-title').textContent = 'Ingresar';
    document.getElementById('msg').className = 'msg';
  }

  async function hacerLogin(){
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if(!email || !pass){ mostrarMsg('Completá email y contraseña.', 'err'); return; }
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Ingresando...';
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    btn.disabled = false; btn.textContent = 'Ingresar';
    if(error){ mostrarMsg('No se pudo ingresar: ' + error.message, 'err'); return; }
    location.href = redirect;
  }

  async function hacerSignup(){
    const nombre = document.getElementById('signup-nombre').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pass = document.getElementById('signup-pass').value;
    if(!nombre || !email || !pass){ mostrarMsg('Completá todos los campos.', 'err'); return; }
    if(pass.length < 6){ mostrarMsg('La contraseña debe tener al menos 6 caracteres.', 'err'); return; }
    const btn = document.getElementById('btn-signup');
    btn.disabled = true; btn.textContent = 'Creando...';
    const { error } = await sb.auth.signUp({
      email, password: pass,
      options: { data: { nombre } }
    });
    btn.disabled = false; btn.textContent = 'Crear cuenta';
    if(error){ mostrarMsg('No se pudo crear la cuenta: ' + error.message, 'err'); return; }
    mostrarMsg('Cuenta creada. Tu acceso queda en revisión de Gerencia hasta que te asignen un rol — mientras tanto ya podés ingresar con permisos básicos.', 'ok');
    setTimeout(()=>{ location.href = redirect; }, 2500);
  }

  // Enter para enviar el formulario visible
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    if(document.getElementById('panel-login').style.display !== 'none') hacerLogin();
    else hacerSignup();
  });
</script>
</body>
</html>
